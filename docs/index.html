<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreOffice SwiftUI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 680px;
            width: 100%;
            padding: 40px 24px;
        }

        /* Lang toggle */
        .lang-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            overflow: hidden;
            z-index: 10;
        }

        .lang-toggle button {
            background: none;
            border: none;
            color: #666;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-toggle button.active {
            background: #4A90D9;
            color: #fff;
        }

        .lang-toggle button:hover:not(.active) {
            color: #aaa;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #4A90D9, #2E5C8A);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: #888;
            line-height: 1.6;
        }

        /* Progress */
        .progress-section {
            background: #141414;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            border: 1px solid #222;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .progress-label .amount {
            color: #4A90D9;
            font-weight: 600;
        }

        .progress-bar {
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #4A90D9, #6BB5FF);
            border-radius: 3px;
            width: 15%;
            transition: width 1s ease;
        }

        /* Methods */
        .methods {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .method-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .method-card:hover {
            border-color: #333;
            transform: translateY(-1px);
        }

        .method-card.active {
            border-color: #4A90D9;
            background: #141a24;
        }

        .method-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 4px;
        }

        .method-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .method-icon.wechat { background: #07C160; }
        .method-icon.alipay { background: #1677FF; }
        .method-icon.stripe { background: #635BFF; }

        .method-info h3 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        .method-info p {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }

        .method-badge {
            margin-left: auto;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1a1a1a;
            color: #666;
            border: 1px solid #222;
        }

        .method-badge.recommended {
            background: #1a2418;
            color: #4ADE80;
            border-color: #2a3a28;
        }

        /* QR */
        .qr-area {
            display: none;
            text-align: center;
            padding: 20px 0 0;
            animation: fadeIn 0.3s ease;
        }

        .qr-area.active { display: block; }

        .qr-area img {
            max-width: 220px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 2px solid #222;
        }

        .qr-area p {
            font-size: 13px;
            color: #666;
            margin-top: 12px;
        }

        /* Stripe */
        .stripe-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .stripe-section.active { display: block; }

        .stripe-btn {
            display: inline-block;
            background: #635BFF;
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .stripe-btn:hover { background: #7A73FF; }

        /* Supporters */
        .supporters {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #1a1a1a;
        }

        .supporters h3 {
            font-size: 14px;
            font-weight: 600;
            color: #888;
            margin-bottom: 16px;
        }

        .supporter-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .supporter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 6px 14px 6px 6px;
            font-size: 13px;
        }

        .supporter .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #1a1a1a;
        }

        .footer a {
            color: #4A90D9;
            text-decoration: none;
            font-size: 13px;
        }

        .footer a:hover { text-decoration: underline; }

        .footer .links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
        }

        .footer .license {
            font-size: 12px;
            color: #444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <!-- Language toggle -->
    <div class="lang-toggle">
        <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="icon">📄</div>
            <h1 data-i18n="title"></h1>
            <p data-i18n="subtitle"></p>
        </div>

        <!-- Monthly Goal -->
        <div class="progress-section">
            <div class="progress-label">
                <span data-i18n="goal_label"></span>
                <span class="amount">¥150 / ¥1,000</span>
            </div>
            <div class="progress-bar">
                <div class="fill"></div>
            </div>
        </div>

        <!-- Payment Methods -->
        <div class="methods">
            <!-- WeChat -->
            <div class="method-card" onclick="toggleMethod('wechat', this)">
                <div class="method-header">
                    <div class="method-icon wechat">💬</div>
                    <div class="method-info">
                        <h3 data-i18n="wechat_title"></h3>
                        <p data-i18n="wechat_desc"></p>
                    </div>
                    <span class="method-badge recommended" data-i18n="badge_recommended"></span>
                </div>
                <div class="qr-area" id="qr-wechat">
                    <img src="images/wechat-qr.png" alt="WeChat QR">
                    <p data-i18n="wechat_scan"></p>
                </div>
            </div>

            <!-- Alipay -->
            <div class="method-card" onclick="toggleMethod('alipay', this)">
                <div class="method-header">
                    <div class="method-icon alipay">🔷</div>
                    <div class="method-info">
                        <h3 data-i18n="alipay_title"></h3>
                        <p data-i18n="alipay_desc"></p>
                    </div>
                    <span class="method-badge" data-i18n="badge_fast"></span>
                </div>
                <div class="qr-area" id="qr-alipay">
                    <img src="images/alipay-qr.png" alt="Alipay QR">
                    <p data-i18n="alipay_scan"></p>
                </div>
            </div>

            <!-- Stripe -->
            <div class="method-card" onclick="toggleMethod('stripe', this)">
                <div class="method-header">
                    <div class="method-icon stripe">💳</div>
                    <div class="method-info">
                        <h3 data-i18n="stripe_title"></h3>
                        <p data-i18n="stripe_desc"></p>
                    </div>
                    <span class="method-badge" data-i18n="badge_hkd"></span>
                </div>
                <div class="stripe-section" id="stripe-section">
                    <div style="text-align: center; padding: 16px 0;">
                        <p style="color: #888; font-size: 13px; margin-bottom: 16px;" data-i18n="stripe_cards"></p>
                        <a href="https://buy.stripe.com/test_3cI5kEa9O55t0Kx05nes000"
                           target="_blank"
                           class="stripe-btn">
                            <span data-i18n="stripe_btn"></span>
                        </a>
                        <p style="color: #555; margin-top: 12px; font-size: 12px;" data-i18n="stripe_note"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Supporters -->
        <div class="supporters">
            <h3 data-i18n="supporters_title"></h3>
            <div class="supporter-list">
                <div class="supporter">
                    <span class="avatar">🫡</span>
                    <span data-i18n="first_supporter"></span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="links">
                <a href="https://github.com/Cass-ette/LibreOfficeSwiftUI" target="_blank">GitHub</a>
                <a href="https://github.com/Cass-ette/libreoffice-swiftui" target="_blank" data-i18n="link_upstream"></a>
                <a href="https://github.com/LibreOffice/core" target="_blank">LibreOffice</a>
            </div>
            <p class="license" data-i18n="license"></p>
        </div>
    </div>

    <script>
        const i18n = {
            zh: {
                title: '支持 LibreOffice SwiftUI',
                subtitle: '一个用 SwiftUI 重写 LibreOffice macOS 前端的开源项目。<br>你的每一份支持都让这个项目走得更远。',
                goal_label: '月度目标',
                wechat_title: '微信支付',
                wechat_desc: '扫码即可，无需添加好友',
                wechat_scan: '打开微信扫一扫，金额自定',
                alipay_title: '支付宝',
                alipay_desc: '支持花呗、余额宝',
                alipay_scan: '打开支付宝扫一扫，金额自定',
                stripe_title: 'International (Card)',
                stripe_desc: 'Visa / Mastercard / Apple Pay',
                stripe_cards: '支持 Visa、Mastercard、Apple Pay',
                stripe_btn: '💳 支持 $5.00 HKD',
                stripe_note: '点击后将跳转到 Stripe 安全支付页面',
                badge_recommended: '推荐',
                badge_fast: '快捷',
                badge_hkd: 'USD / HKD',
                supporters_title: '感谢这些支持者 ❤️',
                first_supporter: '成为第一个支持者',
                link_upstream: '上游仓库',
                license: '本项目基于 LibreOffice (MPL 2.0) 开发 · SwiftUI 前端采用 MIT 协议'
            },
            en: {
                title: 'Support LibreOffice SwiftUI',
                subtitle: 'An open-source project rewriting LibreOffice macOS frontend with SwiftUI.<br>Every contribution helps this project go further.',
                goal_label: 'Monthly Goal',
                wechat_title: 'WeChat Pay',
                wechat_desc: 'Scan QR code, no friend request needed',
                wechat_scan: 'Open WeChat and scan, choose your amount',
                alipay_title: 'Alipay',
                alipay_desc: 'Supports Huabei, Yu\'e Bao',
                alipay_scan: 'Open Alipay and scan, choose your amount',
                stripe_title: 'International (Card)',
                stripe_desc: 'Visa / Mastercard / Apple Pay',
                stripe_cards: 'Supports Visa, Mastercard, Apple Pay',
                stripe_btn: '💳 Donate $5.00 HKD',
                stripe_note: 'You will be redirected to Stripe secure checkout',
                badge_recommended: 'Recommended',
                badge_fast: 'Fast',
                badge_hkd: 'USD / HKD',
                supporters_title: 'Thanks to our supporters ❤️',
                first_supporter: 'Be the first supporter',
                link_upstream: 'Upstream',
                license: 'Based on LibreOffice (MPL 2.0) · SwiftUI frontend under MIT License'
            }
        };

        let currentLang = 'zh';

        function detectLang() {
            const lang = navigator.language || navigator.userLanguage;
            if (lang.startsWith('zh')) return 'zh';
            return 'en';
        }

        function setLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            document.title = i18n[lang].title;

            // Update all i18n elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) {
                    el.innerHTML = i18n[lang][key];
                }
            });

            // Update toggle buttons
            document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        }

        function toggleMethod(method, card) {
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.qr-area').forEach(qr => qr.classList.remove('active'));
            document.querySelectorAll('.stripe-section').forEach(s => s.classList.remove('active'));

            card.classList.add('active');

            if (method === 'wechat') {
                document.getElementById('qr-wechat').classList.add('active');
            } else if (method === 'alipay') {
                document.getElementById('qr-alipay').classList.add('active');
            } else if (method === 'stripe') {
                document.getElementById('stripe-section').classList.add('active');
            }
        }

        // Auto-detect language on load
        setLang(detectLang());
    </script>
</body>
</html>
